services:
  # 电商智能客服Agent主服务（安全加固版）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-cs-agent
    # 不暴露端口到宿主机（由Nginx代理）
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/ecommerce_cs
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./knowledge_base:/app/knowledge_base:ro  # 只读挂载
      - ./logs:/app/logs
    # 安全加固
    read_only: true  # 只读文件系统
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    security_opt:
      - no-new-privileges:true  # 禁止提权
    cap_drop:
      - ALL  # 移除所有Linux capabilities
    cap_add:
      - NET_BIND_SERVICE  # 仅保留绑定端口
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  # Nginx反向代理
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce-cs-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/letsencrypt:ro
      - certbot-data:/var/www/certbot
    depends_on:
      - app
    # 安全加固
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid
      - /var/run:noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped
    networks:
      - internal
      - external

  # PostgreSQL（安全加固版）
  db:
    image: postgres:16-alpine
    container_name: ecommerce-cs-db
    environment:
      POSTGRES_DB: ecommerce_cs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong-password-here}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    # 安全加固
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  # Redis（安全加固版）
  redis:
    image: redis:7-alpine
    container_name: ecommerce-cs-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-strong-password-here}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
      --rename-command DEBUG ""
    expose:
      - "6379"
    # 安全加固
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-strong-password-here}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  # Prometheus监控
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: ecommerce-cs-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=1GB'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    networks:
      - internal

  # Grafana可视化
  grafana:
    image: grafana/grafana:10.1.0
    container_name: ecommerce-cs-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://your-domain.com/grafana
    volumes:
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    networks:
      - internal

  # Certbot (Let's Encrypt SSL自动续期)
  certbot:
    image: certbot/certbot:latest
    container_name: ecommerce-cs-certbot
    volumes:
      - ./deploy/ssl:/etc/letsencrypt
      - certbot-data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - internal

networks:
  internal:
    driver: bridge
    internal: true  # 内部网络，不可外部访问
  external:
    driver: bridge  # 外部网络（仅Nginx）

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  certbot-data:
